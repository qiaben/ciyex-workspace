name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
        default: dev
      ref:
        description: 'Commit SHA to build (leave blank to use HEAD). Use this to promote a tested dev/stage commit up to the next channel.'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.channel || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VSCODE_ARCH: x64
  VSCODE_QUALITY: 'oss'
  CHANNEL: ${{ github.event.inputs.channel || 'dev' }}
  BUILD_REF: ${{ github.event.inputs.ref || github.sha }}
  # Pull the Electron binary from a mirror instead of GitHub's release CDN,
  # which has been returning 504 Gateway Time-out and breaking the build.
  ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'

jobs:
  build:
    name: Build ${{ github.event.inputs.channel || 'dev' }} (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Verify channel + write channel marker
        # Identity (applicationName, AppIds, dataFolderName, mutex, install
        # paths) is unified across dev/stage/prod — a single installer serves
        # all 3 channels and the user picks the channel at the login screen.
        # This step only validates the channel name and records it to
        # .build/channel.txt for downstream steps.
        shell: pwsh
        run: node build/channels/apply.mjs $env:CHANNEL

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Prepare node_modules cache key
        shell: pwsh
        run: |
          mkdir .build -ea 0
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts win32 x64 $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: .build/node_modules_cache
          key: node_modules-win32-x64-${{ hashFiles('.build/packagelockhash') }}

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        shell: pwsh
        run: 7z.exe x .build/node_modules_cache/cache.7z -aoa

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          npm_config_arch: x64
          npm_config_foreground_scripts: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Create node_modules archive
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -Force .build/node_modules_cache
          7z.exe a .build/node_modules_cache/cache.7z -mx3 `@.build/node_modules_list.txt

      - name: Download Electron
        shell: pwsh
        run: npm run electron x64

      - name: Compile core and extensions
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run gulp core-ci

      - name: Build client (minified)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run gulp "vscode-win32-x64-min-ci"

      - name: Build inno updater
        shell: pwsh
        run: npm run gulp "vscode-win32-x64-inno-updater"

      - name: Build user setup (installer)
        shell: pwsh
        run: npm run gulp "vscode-win32-x64-user-setup"

      - name: Compute version + filenames
        shell: pwsh
        run: |
          $Version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $Channel = $env:CHANNEL
          $Suffix = if ($Channel -eq 'prod') { '' } else { (Get-Culture).TextInfo.ToTitleCase($Channel) }
          $ExeName = "CiyexWorkspace${Suffix}Setup-x64-$Version.exe"
          $ZipName = "CiyexWorkspace${Suffix}-win32-x64-$Version.zip"

          echo "APP_VERSION=$Version" >> $env:GITHUB_ENV
          echo "CHANNEL_SUFFIX=$Suffix" >> $env:GITHUB_ENV
          echo "EXE_NAME=$ExeName" >> $env:GITHUB_ENV
          echo "ZIP_NAME=$ZipName" >> $env:GITHUB_ENV

          Write-Host "Channel: $Channel"
          Write-Host "Version: $Version"
          Write-Host "Installer: $ExeName"
          Write-Host "Archive: $ZipName"

      - name: Create portable zip
        shell: pwsh
        run: |
          7z.exe a -tzip "$env:ZIP_NAME" "..\VSCode-win32-x64\*"

      - name: Prepare artifacts
        shell: pwsh
        run: |
          mkdir artifacts -Force
          Move-Item $env:ZIP_NAME artifacts/
          if (Test-Path ".build\win32-x64\user-setup\CiyexWorkspaceSetup.exe") {
            Move-Item ".build\win32-x64\user-setup\CiyexWorkspaceSetup.exe" "artifacts/$env:EXE_NAME"
          } else {
            Write-Error "Installer not found at .build\win32-x64\user-setup\CiyexWorkspaceSetup.exe"
            exit 1
          }

      - name: Generate update manifest
        shell: pwsh
        run: |
          $Version = $env:APP_VERSION
          $Channel = $env:CHANNEL
          $Tag = "v$Version-$Channel.${{ github.run_number }}"
          $BaseUrl = "https://github.com/${{ github.repository }}/releases/download/$Tag"

          function Get-Sha256($path) {
            return (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
          }

          $installer = "artifacts/$env:EXE_NAME"
          $archive = "artifacts/$env:ZIP_NAME"

          $platforms = [ordered]@{
            'win32-x64-user' = [ordered]@{
              url = "$BaseUrl/$env:EXE_NAME"
              sha256 = Get-Sha256 $installer
            }
            'win32-x64' = [ordered]@{
              url = "$BaseUrl/$env:EXE_NAME"
              sha256 = Get-Sha256 $installer
            }
            'win32-x64-archive' = [ordered]@{
              url = "$BaseUrl/$env:ZIP_NAME"
              sha256 = Get-Sha256 $archive
            }
          }

          $manifest = [ordered]@{
            version = $Version
            commit = "$env:BUILD_REF"
            channel = $Channel
            buildNumber = [int]${{ github.run_number }}
            publishedAt = [int][double]::Parse((Get-Date -UFormat %s))
            platforms = $platforms
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "artifacts/metadata.json" -Encoding utf8
          Get-Content artifacts/metadata.json

      - name: Upload artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ciyex-workspace-${{ env.CHANNEL }}-win32-x64
          path: artifacts/*

      - name: Create per-build release (immutable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ env.CHANNEL }}.${{ github.run_number }}
          name: Ciyex Workspace ${{ env.CHANNEL_SUFFIX }} v${{ env.APP_VERSION }} (Build ${{ github.run_number }})
          target_commitish: ${{ env.BUILD_REF }}
          prerelease: ${{ env.CHANNEL != 'prod' }}
          files: artifacts/*
          body: |
            ## Ciyex Workspace ${{ env.CHANNEL_SUFFIX }} — Windows x64

            **Channel:** `${{ env.CHANNEL }}`
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ env.BUILD_REF }}

            ### Downloads
            - **Installer:** `${{ env.EXE_NAME }}`
            - **Portable:** `${{ env.ZIP_NAME }}`

            ### First install
            Download and run the installer. This is the unified Ciyex Workspace
            installer — the binary is the same across all channels. After
            installing, sign in and pick the **Environment** (Dev / Stage /
            Prod) on the login screen. The app then polls that channel's
            `<channel>-latest` pointer every hour and auto-updates — no more
            manual `.exe` distribution. Switching channels later only requires
            signing out, picking a different environment, and signing back in.
            Trigger a check immediately via **Help → Check for Updates**.

      - name: Update channel pointer release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $Tag = "$env:CHANNEL-latest"
          gh release view $Tag --repo ${{ github.repository }} 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $Tag `
              --repo ${{ github.repository }} `
              --title "Ciyex Workspace ($env:CHANNEL) — latest pointer" `
              --notes "Auto-updated pointer release. The metadata.json asset always describes the latest $env:CHANNEL build." `
              --prerelease `
              --target ${{ env.BUILD_REF }}
          }
          gh release upload $Tag "artifacts/metadata.json" --repo ${{ github.repository }} --clobber
          Write-Host "Pointer $Tag updated -> build ${{ github.run_number }}"
